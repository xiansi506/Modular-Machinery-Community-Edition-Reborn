modLoader="javafml"
loaderVersion="[47,)"
license="GPL-3.0"
[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
authors="闲肆"
description='''A Forge 1.20.1 reimplementation foundation for Modular Machinery: Community Edition, with data-driven machines and KubeJS recipes.'''
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"
# 波 5.2：两个**可选**依赖，声明在这里是为了让「本模组与它们的关系」有一处可读的地方。
#
# 这两行**不产生新行为**，写清楚免得被当成「已经接好了」：
#   - kubejs：本模组与它的结合一直走 kubejs.plugins.txt（KubeJS 自己的入口文件），与这份声明无关。
#   - jei：本模组一直走 META-INF/services/mezz.jei.api.IModPlugin（ServiceLoader），也与它无关。
# 也就是说，这两行只是把既有的软关系**登记**下来。
#
# 有意不写 versionRange：装了任意版本的 jei/kubejs 都不该被本模组拒绝启动，而「未装」的情形由
# mandatory=false 表达。写出一个我没实测过的版本区间，风险是把玩家挡在门外，而收益是零。
[[dependencies.${mod_id}]]
    modId="jei"
    mandatory=false
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="kubejs"
    mandatory=false
    ordering="NONE"
    side="BOTH"
# 波 5.3：Mekanism 的化学（旧版的「气体」）是本模组第一个真兼容模块。
#
# 这条声明**是有实质作用的，不是登记**，与上面两条不同：气体端口要把本模组的流体仓暴露成 Mekanism 的
# `IChemicalHandler`，而能力注册发生在 mod 构造期——那时 Mekanism 必须**已经注册过它自己的能力**
# （`IGasHandler.getCapability()` 只有在它自己的 `RegisterCapabilitiesEvent` 之后才拿得到）。
# `ordering="AFTER"` 让 FML 保证那个先后。
#
# mandatory=false：没装 Mekanism 的进程照常启动，只是没有气体端口（`compat/` 的设计就是如此）。
# 同样不写 versionRange：装了任意 1.20.1 的 Mekanism 都不该被本模组拒绝启动。
[[dependencies.${mod_id}]]
    modId="mekanism"
    mandatory=false
    ordering="AFTER"
    side="BOTH"
