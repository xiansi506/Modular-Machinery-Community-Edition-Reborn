plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = mod_version
group = mod_group
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mappings_channel, version: mappings_version
    runs {
        client { workingDirectory project.file('run'); mods { "${mod_id}" { source sourceSets.main } } }
        server { workingDirectory project.file('run'); mods { "${mod_id}" { source sourceSets.main } } }
        data { workingDirectory project.file('run'); args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'); mods { "${mod_id}" { source sourceSets.main } } }
    }
}

repositories {
    maven { name = 'Aliyun'; url = 'https://maven.aliyun.com/repository/public' }
    maven { name = 'BlameJared'; url = 'https://maven.blamejared.com' }
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    if (use_local_deps.toBoolean()) {
        compileOnly fg.deobf('libs:kubejs:1.20.1')
        // 0.28.0: KubeJS's own API is not self-contained here — dev.latvian.mods.kubejs.event.EventHandler
        // extends dev.latvian.mods.rhino.BaseFunction, so every call to EventHandler#post needs Rhino on the
        // compile classpath. Until 0.28.0 nothing in this mod called one, which is why the gap was invisible;
        // the maven path below gets Rhino transitively and this one did not.
        compileOnly fg.deobf('libs:rhino:1.20.1')
        compileOnly fg.deobf('libs:jei:15.49')
        // 0.50.0: Jade. It was NOT a build dependency before — the mod only inferred Jade's behaviour by
        // decompiling its bytecode. It becomes one because the mod now ships its own Jade plugin
        // (integration/jade), and that plugin has to be compiled against the real API.
        compileOnly fg.deobf('libs:jade:11.13.3')
        // 波 5.3: the compat layer's first real module. Declared against the jars this machine actually runs:
        //   libs/mekanism-1.20.1-10.4.16.80.jar   the chemical API we compile against
        //   libs/appliedenergistics2-forge-15.4.10.jar / libs/guideme-20.1.15.jar   the later AE2 module
        // The version is in the file name on purpose: this project has no version catalog, and a jar that
        // silently changes version under a fixed name is the kind of "evidence" this repo has been burned by
        // before.
        //
        // The Mekanism *family* jars (generators / additions / tools) are in libs/ but are NOT declared here:
        // nothing in the chemical API needs them, and an undeclared compile-only jar costs nothing while a
        // declared one the compiler never reads is just noise. The integrating module adds the line when it
        // actually reaches into that jar.
        compileOnly fg.deobf('libs:mekanism:1.20.1-10.4.16.80')
        compileOnly fg.deobf('libs:appliedenergistics2:forge-15.4.10')
        compileOnly fg.deobf('libs:guideme:20.1.15')
    } else {
        compileOnly fg.deobf('dev.latvian.mods:kubejs-forge:2001.6.5-build.16')
        compileOnly fg.deobf('mezz.jei:jei-1.20.1-forge:15.2.0.27')
    }
}

processResources {
    inputs.properties([version: project.version, mod_id: mod_id, mod_name: mod_name])
    filesMatching('META-INF/mods.toml') { expand(version: project.version, mod_id: mod_id, mod_name: mod_name) }
}
